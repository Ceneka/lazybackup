name: lazybackup

# Production-friendly default: pull ghcr.io/ceneka/lazybackup:latest.
# No .env is required (Compose interpolates PORT / paths with the defaults below).
# To build a local image: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  lazybackup:
    image: ghcr.io/ceneka/lazybackup:latest
    container_name: lazybackup
    restart: unless-stopped
    ports:
      # Published on all interfaces by default. A fresh instance has no password
      # until you set one (Settings -> General), so bind loopback only
      # (`127.0.0.1:${PORT:-3000}:3000`) or firewall this port before first start.
      # Anything beyond your LAN belongs behind a TLS reverse proxy.
      - "${PORT:-3000}:3000"
    environment:
      # SQLite must live on a volume or it is lost on every image rebuild/recreate.
      DATABASE_URL: file:/app/data/data.db
      # Next.js standalone binds `process.env.HOSTNAME` (server.js), and Docker
      # injects HOSTNAME=<container hostname>, so the app used to listen ONLY on
      # its own container IP (e.g. 10.0.11.6:3000). Loopback then had nothing on
      # it and the healthcheck below failed forever ("unhealthy"), even though
      # the published port worked. Pin it to 0.0.0.0 so 127.0.0.1, the published
      # port, and the container IP all hit the same listener.
      HOSTNAME: "0.0.0.0"
      # Host path from Compose interpolation (${BACKUP_STORAGE_PATH:-./backups}) is
      # only for the bind mount below; inside the container backups always live at
      # /backups (and /app/backups).
      BACKUP_STORAGE_PATH: /backups
      # HTTPS only (leave unset for plain HTTP/LAN):
      # AUTH_COOKIE_SECURE: "true"
      # ENABLE_HSTS: "true"   # prefer HSTS at the reverse proxy instead
      # Only behind a reverse proxy that overwrites X-Forwarded-Host/Proto/For:
      # AUTH_TRUST_PROXY: "true"
      # Exact public origin required for passkeys behind a proxy:
      # AUTH_PUBLIC_URL: "https://backup.example.com"
      # Bro Space through a tunnel/reverse proxy: peer uploads stream up to
      # 32 GiB, and proxies cap request bodies (Cloudflare Free/Pro/Business:
      # 100 MB). Raise that limit or keep Bro Space on Tailscale/LAN.
    volumes:
      - lazybackup_data:/app/data
      # Same host dir at both paths: UI/examples use /backups/... but older docs used /app/backups/...
      - "${BACKUP_STORAGE_PATH:-./backups}:/backups"
      - "${BACKUP_STORAGE_PATH:-./backups}:/app/backups"
      # Prefer a dedicated directory holding only the keys backups need
      # (e.g. SSH_KEYS_PATH=./lazybackup-ssh) over the whole ~/.ssh.
      - "${SSH_KEYS_PATH:-~/.ssh}:/root/.ssh:ro"
      # Optional: pack Docker volumes / docker-exec DB dumps on this host.
      # Mounting the socket grants the container root-equivalent control of the
      # host Docker daemon — only do this if you trust this instance.
      # - /var/run/docker.sock:/var/run/docker.sock
      # Optional: if Tailscale is installed on the host, uncomment to auto-detect
      # 100.x URL in Settings → Bro Space (adds 0 bytes to the LazyBackup image):
      # - /var/run/tailscale:/var/run/tailscale:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  lazybackup_data:
    driver: local
