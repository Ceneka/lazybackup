name: lazybackup

services:
  lazybackup:
    build:
      context: .
      dockerfile: Dockerfile
    image: lazybackup:local
    container_name: lazybackup
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      # SQLite must live on a volume or it is lost on every image rebuild/recreate.
      DATABASE_URL: file:/app/data/data.db
      # Host path from .env is only for the bind mount below; inside the
      # container backups always live at /backups (and /app/backups).
      BACKUP_STORAGE_PATH: /backups
    volumes:
      - lazybackup_data:/app/data
      # Same host dir at both paths: UI/examples use /backups/... but older docs used /app/backups/...
      - "${BACKUP_STORAGE_PATH:-./backups}:/backups"
      - "${BACKUP_STORAGE_PATH:-./backups}:/app/backups"
      - "${SSH_KEYS_PATH:-~/.ssh}:/root/.ssh:ro"
      # Optional: if Tailscale is installed on the host, uncomment to auto-detect
      # 100.x URL in Settings → Bro Space (adds 0 bytes to the LazyBackup image):
      # - /var/run/tailscale:/var/run/tailscale:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  lazybackup_data:
    driver: local
