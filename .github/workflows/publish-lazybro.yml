name: Publish LazyBro

on:
  push:
    tags:
      - "bro-v*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Same Bun as the Dockerfile / ci.yml: a floating version changes the
          # compiled-binary behavior between releases.
          bun-version: "1.4.4"
      - name: Install and compile
        working-directory: bro
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Generate SHA256SUMS
        working-directory: bro
        run: |
          cd dist
          sha256sum \
            lazybro-linux-x64 \
            lazybro-linux-arm64 \
            lazybro-darwin-arm64 \
            lazybro-darwin-x64 \
            lazybro-windows-x64.exe > SHA256SUMS
      # Floating tag so landing can use a stable download URL (not only version tags).
      - name: Publish LazyBro release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: lazybro
          name: LazyBro
          body: |
            Current LazyBro agent. Replaced on each publish.

            - Linux x64: https://github.com/Ceneka/lazybackup/releases/download/lazybro/lazybro-linux-x64
            - Linux ARM64: https://github.com/Ceneka/lazybackup/releases/download/lazybro/lazybro-linux-arm64
            - macOS Apple Silicon: https://github.com/Ceneka/lazybackup/releases/download/lazybro/lazybro-darwin-arm64
            - macOS Intel: https://github.com/Ceneka/lazybackup/releases/download/lazybro/lazybro-darwin-x64
            - Windows: https://github.com/Ceneka/lazybackup/releases/download/lazybro/lazybro-windows-x64.exe

            Verify a download with `sha256sum -c SHA256SUMS` (macOS: `shasum -a 256 -c SHA256SUMS`).
          files: |
            bro/dist/lazybro-linux-x64
            bro/dist/lazybro-linux-arm64
            bro/dist/lazybro-darwin-arm64
            bro/dist/lazybro-darwin-x64
            bro/dist/lazybro-windows-x64.exe
            bro/dist/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach binaries to version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            bro/dist/lazybro-linux-x64
            bro/dist/lazybro-linux-arm64
            bro/dist/lazybro-darwin-arm64
            bro/dist/lazybro-darwin-x64
            bro/dist/lazybro-windows-x64.exe
            bro/dist/SHA256SUMS
          fail_on_unmatched_files: true
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
