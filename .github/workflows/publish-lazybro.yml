name: Publish LazyBro

on:
  push:
    tags:
      - "bro-v*"
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install and compile
        working-directory: bro
        run: |
          bun install --frozen-lockfile
          bun run build
      # Floating tag so landing can use a stable download URL (not only version tags).
      - name: Publish LazyBro release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lazybro
          name: LazyBro
          body: |
            Current LazyBro agent (linux-x64 and windows-x64). Replaced on each publish.

            - Linux: https://github.com/Ceneka/lazybackup/releases/download/lazybro/lazybro-linux-x64
            - Windows: https://github.com/Ceneka/lazybackup/releases/download/lazybro/lazybro-windows-x64.exe
          files: |
            bro/dist/lazybro-linux-x64
            bro/dist/lazybro-windows-x64.exe
          fail_on_unmatched_files: true
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach binaries to version tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bro/dist/lazybro-linux-x64
            bro/dist/lazybro-windows-x64.exe
          fail_on_unmatched_files: true
          make_latest: ${{ startsWith(github.ref, 'refs/tags/v') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
