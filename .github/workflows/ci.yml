name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "landing/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Host glibc: unit tests + Next build. Alpine/musl is a separate job because
  # native addons (@libsql, argon2) can pass here and fail in the GHCR image.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:/tmp/lazybackup-ci.db

  bro-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install LazyBro dependencies
        working-directory: bro
        run: bun install --frozen-lockfile

      - name: Run LazyBro tests
        working-directory: bro
        run: bun test

  # Production image is Alpine/musl — catch native addon / NFT gaps host glibc misses.
  # Keep this job on the runner's linux/amd64; multi-arch is the publish job only.
  docker-alpine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Alpine unit tests + production smoke
        run: bash scripts/docker-test.sh

  # PRs stop after tests. main / v* / manual dispatch publish once those pass.
  publish-ghcr:
    needs: [test, docker-alpine, bro-test]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tags=ghcr.io/ceneka/lazybackup:latest,ghcr.io/ceneka/lazybackup:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/ceneka/lazybackup:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
