name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "landing/**"
  workflow_dispatch:

env:
  GHCR_IMAGE: ghcr.io/ceneka/lazybackup

permissions:
  contents: read
  actions: write

jobs:
  # Host glibc unit tests (fast fail). Alpine/musl is a separate job because
  # native addons (@libsql, argon2) can pass here and fail in the GHCR image.
  # Next.js compile is the Alpine production build, not a second host `next build`.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  bro-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install LazyBro dependencies
        working-directory: bro
        run: bun install --frozen-lockfile

      - name: Run LazyBro tests
        working-directory: bro
        run: bun test

  # Production image is Alpine/musl — catch native addon / NFT gaps host glibc misses.
  # amd64 only here so we can --load and smoke; GHA cache feeds the tag-time push.
  docker-alpine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Alpine test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          target: test
          platforms: linux/amd64
          load: true
          tags: lazybackup:test
          cache-from: type=gha,scope=lazybackup-amd64

      - name: Run bun test on Alpine
        run: docker run --rm lazybackup:test

      - name: Build Alpine production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: lazybackup:smoke
          cache-from: type=gha,scope=lazybackup-amd64
          cache-to: type=gha,mode=max,scope=lazybackup-amd64,ignore-error=true

      - name: Smoke-test production image
        env:
          IMAGE_SMOKE: lazybackup:smoke
        run: bash scripts/docker-smoke.sh

      # Same layers as the smoke image (GHA cache); no second Next compile.
      - name: Push amd64 image
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-amd64
          cache-from: type=gha,scope=lazybackup-amd64

  # Native arm64 on tags only — no QEMU. Starts in parallel with docker-alpine.
  docker-arm64:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Alpine production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          load: true
          tags: lazybackup:smoke
          cache-from: type=gha,scope=lazybackup-arm64
          cache-to: type=gha,mode=max,scope=lazybackup-arm64,ignore-error=true

      - name: Smoke-test production image
        env:
          IMAGE_SMOKE: lazybackup:smoke
        run: bash scripts/docker-smoke.sh

      - name: Push arm64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ env.GHCR_IMAGE }}:${{ github.ref_name }}-arm64
          cache-from: type=gha,scope=lazybackup-arm64

  # v* tags only: stitch the native amd64 + arm64 images into :tag and :latest.
  # PRs / main stop after tests so a `git push origin main --tags` does not
  # publish twice.
  publish-ghcr:
    needs: [test, docker-alpine, bro-test, docker-arm64]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          IMAGE="${GHCR_IMAGE}"
          docker buildx imagetools create \
            -t "${IMAGE}:${TAG}" \
            -t "${IMAGE}:latest" \
            "${IMAGE}:${TAG}-amd64" \
            "${IMAGE}:${TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE}:${TAG}"

  # v* tags: GitHub Release body = CHANGELOG section (see bun run release).
  # LazyBro may create the same tag first to attach binaries; edit keeps assets.
  github-release:
    needs: [test, docker-alpine, bro-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES="$(bun run scripts/cut-release.ts notes "$VERSION")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "LazyBackup $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "LazyBackup $TAG" --notes "$NOTES"
          fi
