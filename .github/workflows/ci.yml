name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "landing/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  # Host glibc unit tests (fast fail). Alpine/musl is a separate job because
  # native addons (@libsql, argon2) can pass here and fail in the GHCR image.
  # Next.js compile is the Alpine production build, not a second host `next build`.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

  bro-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install LazyBro dependencies
        working-directory: bro
        run: bun install --frozen-lockfile

      - name: Run LazyBro tests
        working-directory: bro
        run: bun test

  # Production image is Alpine/musl — catch native addon / NFT gaps host glibc misses.
  # amd64 only here so we can --load and smoke; GHA cache feeds publish-ghcr.
  docker-alpine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Alpine test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: test
          platforms: linux/amd64
          load: true
          tags: lazybackup:test
          cache-from: type=gha,scope=lazybackup

      - name: Run bun test on Alpine
        run: docker run --rm lazybackup:test

      - name: Build Alpine production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: lazybackup:smoke
          cache-from: type=gha,scope=lazybackup
          cache-to: type=gha,mode=max,scope=lazybackup,ignore-error=true

      - name: Smoke-test production image
        env:
          IMAGE_SMOKE: lazybackup:smoke
        run: bash scripts/docker-smoke.sh

  # PRs stop after tests. main / v* / manual dispatch push using Alpine/amd64
  # layers from docker-alpine; arm64 is the extra compile (then cached too).
  publish-ghcr:
    needs: [test, docker-alpine, bro-test]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tags=ghcr.io/ceneka/lazybackup:latest,ghcr.io/ceneka/lazybackup:${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/ceneka/lazybackup:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=lazybackup
          cache-to: type=gha,mode=max,scope=lazybackup,ignore-error=true

  # v* tags: GitHub Release body = CHANGELOG section (see bun run release).
  # LazyBro may create the same tag first to attach binaries; edit keeps assets.
  github-release:
    needs: [test, docker-alpine, bro-test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          NOTES="$(bun run scripts/cut-release.ts notes "$VERSION")"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "LazyBackup $TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --title "LazyBackup $TAG" --notes "$NOTES"
          fi
