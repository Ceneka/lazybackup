name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "landing/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:/tmp/lazybackup-ci.db
