name: CI

on:
  pull_request:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "landing/**"
      - "bro/**"

jobs:
  # Host glibc: unit tests + Next build. Alpine/musl is a separate job because
  # native addons (@libsql, argon2) can pass here and fail in the GHCR image.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.13"

      - name: Install rsync
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rsync

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun test

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: file:/tmp/lazybackup-ci.db

  # Production image is Alpine/musl — catch native addon / NFT gaps host glibc misses.
  docker-alpine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Alpine unit tests + production smoke
        run: bash scripts/docker-test.sh
