      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="lb-glow" x1="16" y1="0" x2="16" y2="20" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".3"/>
